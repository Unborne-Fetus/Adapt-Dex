name: Import Adapt Dex from Brisk Dex
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-adapt-dex.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out new Adapt Dex repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch established Adapt Dex code
        run: |
          git clone --depth 1 --branch adapt-dex https://github.com/Unborne-Fetus/Brisk-Dex.git /tmp/adapt-source
          test "$(git -C /tmp/adapt-source rev-parse HEAD)" = "adf1e5f56d94cfb5bd9df7d88eeec3cb343327b2"
      - name: Copy all Adapt Dex project files
        run: |
          rsync -a --delete --exclude=.git /tmp/adapt-source/ ./
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-adapt-web.yml')
          s=p.read_text()
          s=s.replace('branches: [adapt-dex]', 'branches: [main]')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate full Adapt Dex project from Brisk-Dex/adapt-dex"
          git push origin HEAD:main
